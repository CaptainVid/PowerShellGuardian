name: Build PowerShell Guardian

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MinGW
        shell: powershell
        run: |
          choco install mingw -y

      - name: Install NSIS
        shell: powershell
        run: |
          choco install nsis.install -y

          $nsis = Get-ChildItem "C:\Program Files*" -Filter "makensis.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

          if (-not $nsis) {
              throw "NSIS installation failed. makensis.exe not found."
          }

          echo "NSIS_PATH=$($nsis.FullName)" >> $env:GITHUB_ENV
          Write-Host $nsis.FullName

      - name: Verify tools
        shell: powershell
        run: |
          g++ --version
          windres --version
          & $env:NSIS_PATH -VERSION

      - name: Build PowerShell Guardian
        shell: pwsh
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope Process
          .\build.ps1 -MakeNsis $env:NSIS_PATH

      - name: Run security tests
        shell: pwsh
        run: |
          python tests/security_contract_test.py

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PowerShellGuardian-build
          path: |
            build/**
            *.exe
